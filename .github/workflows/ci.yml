name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefer-online
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Full audit also includes an unpatched braces advisory in Next's lint tooling.
      - run: npm audit --omit=dev --audit-level=moderate
